# Configuration file for training

# Model settings
model:
  type: "PilotNet"  # Options: PilotNet, SimplePilotNet
  input_channels: 3
  output_size: 1  # Number of outputs (1 for steering only, 2 for steering+throttle, etc.)
  dropout_rate: 0.5

# Data settings
data:
  train_csv: "data/train.csv"
  val_csv: "data/val.csv"
  test_csv: "data/test.csv"
  root_dir: "data/raw"
  image_size: [66, 200]  # [height, width]
  target_columns: ["steering_angle"]  # Columns to predict
  batch_size: 64
  num_workers: 4
  shuffle: true

# Training settings
training:
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"  # Options: adam, sgd, rmsprop
  loss_function: "mse"  # Options: mse, mae, huber
  
  # Learning rate scheduler
  scheduler:
    type: "ReduceLROnPlateau"  # Options: ReduceLROnPlateau, StepLR, CosineAnnealingLR
    patience: 5
    factor: 0.5
    min_lr: 0.00001

# Paths
paths:
  model_dir: "models"
  log_dir: "logs"
  checkpoint_dir: "models/checkpoints"
  
# Device
device: "cuda"  # Options: cuda, cpu (will automatically use cpu if cuda is not available)

# Miscellaneous
seed: 42
save_best: true
max_checkpoints: 5
